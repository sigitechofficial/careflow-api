name: Deploy API to Azure

# Every merge into `azure` (or a manual run): build both images, test them end to end
# against a throwaway Postgres, and only then push, migrate and roll out.
# Signs in with OIDC (managed identity id-careflow-github-deploy) — no stored credentials.
on:
  push:
    branches: [azure]
    # The job-trigger Function App deploys on its own (deploy-azure-functions.yml); a push that
    # only touches it must not rebuild and roll out the API. Mixed pushes still deploy both.
    paths-ignore:
      - "functions/**"
      - ".github/workflows/deploy-azure-functions.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-api
  cancel-in-progress: false

env:
  RG: rg-careflow-prod
  ACR: acrcareflowprod.azurecr.io
  APP: allforcare-api
  JOB: job-careflow-migrate
  # Scheduled Container Apps Jobs that run the API image as a CLI (node dist/src/jobs/run-job.js <name>).
  SCHEDULED_JOBS: job-careflow-rolling-rota job-careflow-plan-end job-careflow-learning job-careflow-care-plan-reviews

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Image tag = short commit
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          load: true
          tags: ${{ env.ACR }}/careflow-migrate:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: ${{ env.ACR }}/careflow-api:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (throwaway Postgres — nothing in production is touched)
        run: |
          set -euo pipefail
          MIG=$ACR/careflow-migrate:$TAG; API=$ACR/careflow-api:$TAG
          DB_URL='postgresql://postgres:smoke@db:5432/careflow?schema=public'
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=careflow postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres -d careflow && break; sleep 2; done

          q() { docker exec db psql -U postgres -d careflow -At -c "$1"; }
          # Row count of every table, to prove re-seeding (every production deploy) adds nothing.
          snapshot() { q "select string_agg(t || '=' || n, ',' order by t) from (select format('%I.%I', schemaname, tablename) t, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', schemaname, tablename), false, true, '')))[1]::text::bigint n from pg_tables where schemaname not in ('pg_catalog','information_schema') and tablename <> '_prisma_migrations') x"; }
          for run in 1 2; do
            echo "::group::migrations + reference seeds (run $run of 2 — production re-seeds on every deploy)"
            docker run --rm --network smoke -e DATABASE_URL="$DB_URL" \
              -e ADMIN_SEED_EMAIL=smoke-admin@example.test -e ADMIN_SEED_PASSWORD=smoke-test-password-123 "$MIG"
            echo "::endgroup::"
            [ "$run" = 1 ] && first=$(snapshot)
          done
          [ "$first" = "$(snapshot)" ] || { echo "::error::re-running the seeders changed data — seeders must be idempotent"; exit 1; }

          # Production must only ever receive reference data: no people, demo/sample records or fake costs.
          fail=0
          expect() { got=$(q "$2"); if [ "$got" != "$3" ]; then echo "::error::$1: expected $3, got $got"; fail=1; else echo "ok  $1 = $got"; fi; }
          expect "users (only the seeded super admin)" 'select count(*) from identity."User"' 1
          expect "employees" 'select count(*) from employees."Employee"' 0
          expect "service users" 'select count(*) from service_users."ServiceUser"' 0
          expect "office-user branch scopes" 'select count(*) from identity."UserLocation"' 0
          expect "branches (the 5 real Allfor Care branches)" 'select count(*) from scheduling."ScheduleArea"' 5
          expect "non-real branches" $'select count(*) from scheduling."ScheduleArea" where code not like \'ALLFOR\\_%\'' 0
          expect "locations" 'select count(*) from lookups."Location"' 5
          expect "pay cards (sample rate cards)" 'select count(*) from billing."PayCard"' 0
          expect "charge cards (sample rate cards)" 'select count(*) from billing."ChargeCard"' 0
          expect "visit plans" 'select count(*) from service_users."ServiceUserVisitPlan"' 0
          expect "scheduled jobs (visits)" 'select count(*) from scheduling."ScheduledJob"' 0
          expect "initial assessments" 'select count(*) from service_users."InitialAssessmentSubmission"' 0
          expect "incidents" 'select count(*) from incidents."Incident"' 0
          expect "Azure cost rows (only ever from Azure)" 'select count(*) from platform."AzureCostDaily"' 0
          [ "$fail" = 0 ] || { echo "::error::seeding created data that must never reach production"; exit 1; }

          docker run -d --name api --network smoke -p 3000:3000 -e DATABASE_URL="$DB_URL" \
            -e JWT_ACCESS_TOKEN_SECRET=smoke -e JWT_REFRESH_TOKEN_SECRET=smoke \
            -e FIELD_ENCRYPTION_KEY=c21va2UtdGVzdC1rZXktMzItYnl0ZXMtbG9uZyEhISE= -e MAIL_MODE=log "$API"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/health/ready; echo
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health/live)" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/docs)" = 404 ] || { echo "::error::Swagger is exposed in production mode"; exit 1; }

          docker run --rm -w /app "$API" node -e "require('./dist/src/common/utils/html-to-pdf.util').renderHtmlToPdfBuffer('<p>Zoë Łukasz مرحبا</p>').then(b => { if (b.subarray(0,5).toString() !== '%PDF-') throw new Error('not a PDF'); console.log('PDF ok: ' + b.length + ' bytes'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"

      - name: Smoke test logs (on failure)
        if: failure()
        run: docker logs api 2>&1 | tail -80 || true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push images to ACR
        run: |
          az acr login --name "${ACR%%.*}"
          docker push "$ACR/careflow-migrate:$TAG"
          docker push "$ACR/careflow-api:$TAG"

      - name: Run database migrations (Container Apps Job)
        run: |
          set -euo pipefail
          az containerapp job update -g "$RG" -n "$JOB" --image "$ACR/careflow-migrate:$TAG" -o none
          EXE=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          echo "execution: $EXE"
          for i in $(seq 1 80); do
            st=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$EXE" --query properties.status -o tsv)
            case "$st" in Succeeded) echo "migrations: Succeeded"; exit 0;; Failed|Stopped|Degraded) echo "::error::migration job $EXE ended $st — API not updated"; exit 1;; esac
            sleep 15
          done
          echo "::error::migration job $EXE timed out"; exit 1

      - name: Roll out new API revision
        run: |
          set -euo pipefail
          az containerapp update -g "$RG" -n "$APP" --image "$ACR/careflow-api:$TAG" -o none
          FQDN=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 60); do
            live=$(az containerapp revision list -g "$RG" -n "$APP" --query "[?properties.trafficWeight==\`100\` && properties.healthState=='Healthy'].properties.template.containers[0].image | [0]" -o tsv)
            [ "$live" = "$ACR/careflow-api:$TAG" ] && break; sleep 10
          done
          [ "$live" = "$ACR/careflow-api:$TAG" ] || { echo "::error::new revision did not become healthy; previous revision keeps serving"; exit 1; }
          curl -fsS --retry 10 --retry-delay 3 "https://$FQDN/health/ready"; echo
          echo "### ✅ API $TAG live at https://$FQDN" >> "$GITHUB_STEP_SUMMARY"

      # Only after the API revision is live and healthy (same image, migrations already applied):
      # point the daily scheduled jobs at the new image so their next run uses this code.
      # Until the jobs exist (deploy/azure/scheduled-jobs/02 + 04) a job is skipped with a warning.
      # Once they exist, set repo variable SCHEDULED_JOBS_REQUIRED=true so a missing/unreadable
      # job fails the deploy instead (prevents jobs silently staying on an old image).
      - name: Update scheduled Container Apps Jobs to the new image
        env:
          REQUIRED: ${{ vars.SCHEDULED_JOBS_REQUIRED }}
        run: |
          set -euo pipefail
          for J in $SCHEDULED_JOBS; do
            if out=$(az containerapp job show -g "$RG" -n "$J" --query name -o tsv 2>&1); then
              az containerapp job update -g "$RG" -n "$J" --container-name job --image "$ACR/careflow-api:$TAG" -o none
              img=$(az containerapp job show -g "$RG" -n "$J" --query "properties.template.containers[0].image" -o tsv)
              [ "$img" = "$ACR/careflow-api:$TAG" ] || { echo "::error::$J still on $img"; exit 1; }
              echo "updated $J -> $img"
              echo "- scheduled job \`$J\` -> $TAG" >> "$GITHUB_STEP_SUMMARY"
            elif grep -qE 'ResourceNotFound|AuthorizationFailed|was not found' <<<"$out"; then
              # ARM answers 403 (not 404) for a job that does not exist when the deploy identity has
              # no role at resource-group scope, so both mean "not created / not granted yet".
              msg="Container Apps Job $J does not exist yet or id-careflow-github-deploy has no role on it (deploy/azure/scheduled-jobs/02 + 04)"
              if [ "$REQUIRED" = "true" ]; then echo "::error::$msg"; exit 1; fi
              echo "::warning::$msg - skipped"
            else
              echo "$out"; echo "::error::could not read $J"; exit 1
            fi
          done
